    <style>
        * {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif !important;
            -webkit-font-smoothing: antialiased;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at top right, #1a1a3a, #0d0d15);
            background-attachment: fixed;
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .premium-border {
            border: 1px solid rgba(199, 115, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

       
.premium-border:hover {
    transform: scale(1.05); 
    z-index: 30 !important; 
    border-color: rgba(199, 115, 255, 0.8);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
}

        section {
    overflow: visible !important;
        }

        .flex.overflow-x-auto {
    overflow-y: visible !important;
    overflow-x: scroll !important;
        }



#sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100%;
    width: 280px;
    background-color: #0d0d15;
    border-right: 1px solid rgba(255, 255, 255, 0.1);
    z-index: 60;
    transform: translateX(-100%);
    transition: transform 0.3s ease-out;
    padding: 1.5rem;
}


#sidebar-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    z-index: 50;
    opacity: 0;
    transition: opacity 0.3s ease;
}


.overlay-visible {
    display: block !important;
    opacity: 1 !important;
}
        
        .no-scrollbar::-webkit-scrollbar { 
            display: none; 
        }
        
        .no-scrollbar { 
            -ms-overflow-style: none; 
            scrollbar-width: none; 
        }

        .fab-main {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            background: linear-gradient(135deg, #c773ff, #6a5aff);
        }

        .fab-menu-btn {
            background: #1a1a1a;
            color: #ffffff;
        }

        @media (prefers-color-scheme: light) {
            body {
                background: #ffffff;
                color: #111111;
            }
            .premium-border {
                border: 1px solid rgba(106, 90, 255, 0.2);
                background: #f9f9f9;
            }
            .premium-border:hover {
                border-color: #6a5aff;
                box-shadow: 0 10px 25px rgba(106, 90, 255, 0.2);
            }
            .fab-menu-btn {
                background: #ffffff;
                color: #111111;
            }
            .theme-text {
                color: #111111;
            }
            .theme-subtext {
                color: #666666;
            }
        }
    </style>

        window.openChat = function(charTitle) {
    // Find the character data
    const char = characterCards.find(c => c.title === charTitle);
    if (!char) return;

    // Inject data into the Chat UI
    document.getElementById('chat-name').innerText = char.title;
    document.getElementById('chat-avatar').src = char.img;
    document.getElementById('chat-large-avatar').src = char.img;
    document.getElementById('chat-description').innerText = char.chatDesc;

    // Slide up the interface
    const chatUI = document.getElementById('chat-interface');
    chatUI.classList.remove('translate-y-full');
}

window.closeChat = function() {
    const chatUI = document.getElementById('chat-interface');
    chatUI.classList.add('translate-y-full');
}
        
        window.toggleSidebar = function(open) {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');

    if (open) {
        
        sidebar.style.transform = 'translateX(0%)';
        overlay.classList.remove('hidden');
        setTimeout(() => overlay.style.opacity = '1', 10);
    } else {

        sidebar.style.transform = 'translateX(-100%)';
        overlay.style.opacity = '0';
        setTimeout(() => overlay.classList.add('hidden'), 300);
    }
        }

        function toggleFab() {
            const menu = document.getElementById('fab-menu');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                setTimeout(() => {
                    menu.classList.remove('opacity-0', 'scale-90');
                }, 10);
            } else {
                menu.classList.add('opacity-0', 'scale-90');
                setTimeout(() => {
                    menu.classList.add('hidden');
                }, 300);
            }
        }

        renderApp();
